name: Shiwei Atlas CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JS syntax
        run: for f in src/*.js src/**/*.js scripts/*.js; do node --check "$f"; done
      - name: Build bundle and SEO topics
        run: npm run build
      - name: Validate dataset integrity
        run: npm run validate
      - name: Run unit & MCP integration tests
        run: npm test
